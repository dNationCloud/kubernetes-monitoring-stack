#  Values for a simple textfile collector that scrapes vfio usage metrics

kube-prometheus-stack:
  prometheus-node-exporter:
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/tmp/textfile_collector
    sidecars:
    - name: gpu-usage
      image: ghcr.io/dnationcloud/vfio-exporter:latest
    containerSecurityContext:
      privileged: true
    securityContext:
      runAsNonRoot: false
    sidecarVolumeMount:
    - name: textfile-dir
      mountPath: /tmp/textfile_collector
      readOnly: false
    sidecarHostVolumeMounts:
      - name: dev-vfio
        mountPath: /dev/vfio
        hostPath: /dev/vfio
        type: DirectoryOrCreate
        readOnly: true
